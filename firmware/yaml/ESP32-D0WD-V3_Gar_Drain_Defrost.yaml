esphome:
  name: esp-garage-drain-defrost
  friendly_name: "Garage Drain Defrost"
  comment: !secret device_comment
  build_path: "D:/Code/VSCode_Programs/ESP32/GARAGE_DRAIN_DEFROST/firmware/.esphome"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Základní logování (při ladění klidně DEBUG)
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret fallback
    
# Web rozhraní pro rychlou diagnostiku
web_server:
  port: 80
  version: 2

# Základní I/O – uprav později dle své DPS (jen placeholdery)
# Např. řídicí výstup vyhřívání, vstup čidla teploty/termostatu apod.
output:
  - platform: gpio
    id: heater_out
    pin: GPIO2

switch:
  - platform: output
    name: "Heater Enable"
    output: heater_out
    restore_mode: ALWAYS_OFF
