# ===================== GARAGE_DRAIN_DEFROST (ESP32-WROOM-32UE) =====================
# NOTE: This version includes:
#  1) Dynamic DS18B20 polling (base 20s, on-demand fast refresh 5s; no median
#     filter, BUG-006 — these sensors don't drift/spike)
#  2) Simulation mode (override temperatures from UI/HA without recompiling)
#     -> "(used)" sensors feed the logic (real vs simulated values)
#  3) ERROR DETECTION SYSTEM with WiFi & sensor failure monitoring
#     -> 5-minute WiFi filter (ignores brief glitches)
#     -> Concurrent error exposure to HA
#     -> Individual binary sensors + human-readable text status
#     -> ERR LED (ADR-004): led_sequencer, 1x-5x pulse codes (err_wifi/t1/t2/t3/t4)
#     -> WD LED (ADR-004): led_sequencer, 4 mutually-exclusive continuous states
# ------------------------------------------------------------------------------------
esphome:
  name: esp-garage-drain-defrost
  friendly_name: "Garage Drain Defrost"
  comment: !secret device_comment
  build_path: "D:/Code/VSCode_Programs/ESP32/GARAGE_DRAIN_DEFROST/firmware/.esphome"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ADR-004: led_sequencer ported from Garage_Windows (OI10), beze změny enginu.
external_components:
- source:
    type: local
    path: ../custom_components
  components: [led_sequencer]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none # critical for stable API/logs
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret fallback

# Web UI for quick checks & simulation controls
web_server:
  port: 80
  version: 2

# ------------------------ 1‑Wire BUS (shared) ------------------------
one_wire:
- platform: gpio
  pin: GPIO21 # shared DS18B20 bus

# ======================== GLOBALS ========================
globals:
# Error flags: individual booleans for each error type
# WiFi connection lost (filtered: 5 min of sustained disconnection)
- id: err_wifi_lost
  type: bool
  restore_value: false
  initial_value: 'false'

# Per-sensor NaN failure flags (ADR-004: split from paired err_t1_t2_fail/
# err_t3_t4_fail so each ERR LED code — err_t1..err_t4 — is independently
# addressable, and so each check can be re-pointed at the `_used` layer
# instead of the raw sensor (OI11: Simulation Mode no longer trips a false
# sensor-fail on physically absent T3/T4 while sim_mode is ON).
- id: err_t1
  type: bool
  restore_value: false
  initial_value: 'false'

- id: err_t2
  type: bool
  restore_value: false
  initial_value: 'false'

- id: err_t3
  type: bool
  restore_value: false
  initial_value: 'false'

- id: err_t4
  type: bool
  restore_value: false
  initial_value: 'false'

# WiFi error debounce counter (seconds since disconnect)
# Seconds elapsed since WiFi was lost (used for 5-min filter: 300 sec)
- id: wifi_lost_duration_sec
  type: uint32_t
  restore_value: false
  initial_value: '0'

# Defrost state flag
# True when defrost cycle is actively running
- id: defrost_running
  type: bool
  restore_value: false
  initial_value: 'false'

# Simulation Mode persistent flag
# Enable/disable simulation mode (true=simulated temps, false=real sensors)
- id: sim_mode_state
  type: bool
  restore_value: true
  initial_value: 'false'

# Main system switch
# Enable/disable entire system (maintenance/summer mode)
- id: main_system_enabled
  type: bool
  restore_value: true
  initial_value: 'true'

# ======================== SENSORS ========================
sensor:
# Outside Temperature (T1)
#
# BUG-006 (S10, 2026-07-31): median filter disabled + update_interval
# 120s→20s on all 4 raw DS18B20 sensors. Root cause (found testing err_t1 with
# T1's data wire physically disconnected): MedianFilter::get_window_values_()
# (filter.cpp) explicitly SKIPS NaN entries when computing the published
# median — a single/few bad reads get silently masked by the remaining good
# samples still in the window. Combined with a slow/unaccelerated
# update_interval (120s for T1 always; 120s for T2/T3/T4 whenever HEAT_MODE/
# heater isn't currently armed), a genuinely failed sensor could take up to
# window_size × update_interval (5 × 120s = 10 min, worst case ~20 min at a
# window-boundary) before the published state actually turns NaN and trips
# err_t1..t4. These sensors (outdoor/HVAC/chassis/drain temps) don't drift or
# spike — filtering wasn't buying anything here, just delaying failure
# detection. Re-enable (uncomment) if field data shows real read noise.
- platform: dallas_temp
  address: 0x3400000051876f28 # commissioned S5 2026-07-28 (test01 HW bring-up)
  name: "Outside Temperature"
  id: t_outside
  update_interval: 20s
  accuracy_decimals: 1
  # filters:
  #   median:
  #     window_size: 5
  #     send_every: 5
  #     send_first_at: 1

    # Gas Inlet Temperature (T2)
    # ADR-011 (S9, 2026-07-31): renamed from the old "evaporator" id. Sensor sits on the gas outlet
    # tube of the outdoor unit heat exchanger (4-way valve port C side, ⌀9.5mm),
    # not the TE-analogous liquid/termination side the old name implied — this is
    # the earliest physical point to detect a reverse-defrost cycle. See DECISIONS.md.
    # BUG-006: median filter disabled, base interval 120s→20s — see T1 above.
- platform: dallas_temp
  address: 0xab030a9794259928 # commissioned S5 2026-07-28 (test01 HW bring-up)
  name: "Gas Inlet Temperature"
  id: t_gas_inlet
  update_interval: 20s
  accuracy_decimals: 1
  # filters:
  #   median:
  #     window_size: 5
  #     send_every: 5
  #     send_first_at: 1

    # Toshiba Chassis (T3)
    # BUG-006: median filter disabled, base interval 120s→20s — see T1 above.
- platform: dallas_temp
  address: 0x3 # TODO: replace with real address
  name: "Chassis Temperature"
  id: t_chassis
  update_interval: 20s
  accuracy_decimals: 1
  # filters:
  #   median:
  #     window_size: 5
  #     send_every: 5
  #     send_first_at: 1

    # Drain Pipe (T4)
    # BUG-006: median filter disabled, base interval 120s→20s — see T1 above.
- platform: dallas_temp
  address: 0x4 # TODO: replace with real address
  name: "Drain Pipe Temperature"
  id: t_drain
  update_interval: 20s
  accuracy_decimals: 1
  # filters:
  #   median:
  #     window_size: 5
  #     send_every: 5
  #     send_first_at: 1

    # "USED" sensors: logic consumes these; they switch between real & simulated
    # values depending on Simulation Mode.
    #
    # BUG-005: read the global `sim_mode_state` directly, NOT `id(sim_mode).state`
    # (the switch's own published/derived state). `sim_mode` is `optimistic: false`
    # with a `lambda:`, so `TemplateSwitch::write_state()` fires turn_on_action/
    # turn_off_action SYNCHRONOUSLY but only calls `publish_state()` for optimistic
    # switches (template_switch.cpp) — for a non-optimistic template switch,
    # publish happens later, on the switch's own next `loop()` pass, when its
    # lambda (`return id(sim_mode_state);`) is re-evaluated. That means the BUG-002
    # fix's four forced `component.update:` calls (inside turn_on/turn_off_action)
    # run BEFORE `id(sim_mode).state` reflects the new mode — they end up
    # re-reading the OLD mode's values, a no-op, and the four `_used` sensors are
    # left to drift back onto their own uncoordinated 5s pollers, reopening the
    # exact stale/fresh mismatch BUG-002 fixed. `sim_mode_state` itself IS set
    # synchronously as the very first step of turn_on/turn_off_action, before the
    # four forced updates — reading it directly here closes the gap. Confirmed via
    # log (2026-07-31): rising edge on Sim ON showed 'Gas Inlet Temperature (used)'
    # still holding a stale ~30°C real reading for 5s after 'Outside Temperature
    # (used)' had already jumped to a fresh ~1.5°C sim reading, spuriously
    # satisfying DEFROST_ORDERED. See BUGS.md BUG-005.
- platform: template
  name: "Outside Temperature (used)"
  id: t_outside_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode_state)) {
      return id(sim_t_outside).state;
    } else {
      return id(t_outside).state;
    }

- platform: template
  name: "Gas Inlet Temperature (used)"
  id: t_gas_inlet_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode_state)) {
      return id(sim_t_gas_inlet).state;
    } else {
      return id(t_gas_inlet).state;
    }

- platform: template
  name: "Chassis Temperature (used)"
  id: t_chassis_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode_state)) {
      return id(sim_t_chassis).state;
    } else {
      return id(t_chassis).state;
    }

- platform: template
  name: "Drain Pipe Temperature (used)"
  id: t_drain_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode_state)) {
      return id(sim_t_drain).state;
    } else {
      return id(t_drain).state;
    }

# ======================== TEXT SENSORS ========================
# Human-readable error status for HA dashboard
# Shows ALL concurrent errors as comma-separated list
# Update interval: 60s (reduced traffic to HA)
text_sensor:
- platform: template
  name: "Error Status"
  id: sensor_error_status
  update_interval: 60s
  lambda: |-
    // Build comma-separated list of ALL active errors
    std::string status = "OK";
    std::vector<std::string> active_errors;

    if (id(err_wifi_lost)) {
      active_errors.push_back("WiFi Lost");
    }
    if (id(err_t1)) {
      active_errors.push_back("T1 Fail");
    }
    if (id(err_t2)) {
      active_errors.push_back("T2 Fail");
    }
    if (id(err_t3)) {
      active_errors.push_back("T3 Fail");
    }
    if (id(err_t4)) {
      active_errors.push_back("T4 Fail");
    }

    if (!active_errors.empty()) {
      status = "";
      for (size_t i = 0; i < active_errors.size(); i++) {
        status += active_errors[i];
        if (i < active_errors.size() - 1) {
          status += ", ";  // comma-separated list
        }
      }
    }
    return status;

# ======================== BINARY SENSORS ========================
binary_sensor:
# DI1 (GPIO36) — Reserved
- platform: gpio
  id: di1_in
  name: "DI1 (Reserved)"
  pin:
    number: GPIO36
  filters:
  - delayed_on: 30ms
  - delayed_off: 30ms
  internal: true
  on_press:
  - logger.log: "DI1: PRESSED"
  on_release:
  - logger.log: "DI1: RELEASED"

# DI2 (GPIO39) — Reserved
- platform: gpio
  id: di2_in
  name: "DI2 (Reserved)"
  pin:
    number: GPIO39
  filters:
  - delayed_on: 30ms
  - delayed_off: 30ms
  internal: true
  on_press:
  - logger.log: "DI2: PRESSED"
  on_release:
  - logger.log: "DI2: RELEASED"

# HEAT_MODE (uses OUTSIDE (used) & thresholds)
# Enabled when outside temp ≤ heat_on_th
# Disabled when outside temp ≥ heat_off_th
# Hysteresis: dual thresholds prevent oscillation
- platform: template
  name: "HEAT_MODE"
  id: bs_heat_mode
  device_class: cold
  lambda: |-
    // If main system is disabled, HEAT_MODE is always OFF
    if (!id(main_system_enabled)) {
      return false;
    }

    if (!isnan(id(t_outside_used).state) &&
        !isnan(id(heat_on_th).state) &&
        !isnan(id(heat_off_th).state)) {
      static bool heat = false;
      const float t = id(t_outside_used).state;
      if (t <= id(heat_on_th).state) heat = true;
      if (t >= id(heat_off_th).state) heat = false;
      return heat;
    }
    return {};

# DEFROST_ORDERED (uses GAS INLET (used), OUTSIDE (used) & thresholds)
# Triggered when:
#   1) T2 (gas inlet) ≥ def_abs_th AND
#   2) ΔT = (T2 - T1) ≥ def_dt_th AND
#   3) HEAT_MODE is armed (ADR-009: freeze-relevance gate)
# All three conditions required (AND logic)
- platform: template
  name: "DEFROST_ORDERED"
  id: bs_defrost
  lambda: |-
    // If main system is disabled, defrost request is always OFF
    if (!id(main_system_enabled)) {
      return false;
    }

    if (!isnan(id(t_gas_inlet_used).state) &&
        !isnan(id(t_outside_used).state) &&
        !isnan(id(def_abs_th).state) &&
        !isnan(id(def_dt_th).state)) {
      const float te = id(t_gas_inlet_used).state;
      const float to = id(t_outside_used).state;
      const bool abs_ok = te >= id(def_abs_th).state;
      const bool dt_ok  = (te - to) >= id(def_dt_th).state;
      return abs_ok && dt_ok && id(bs_heat_mode).state;   // ADR-009
    }
    return {};

# Individual error binary sensors for HA exposure
# These allow concurrent error detection (all shown independently)
- platform: template
  name: "Error: WiFi Lost"
  id: bs_err_wifi_lost
  device_class: problem
  lambda: 'return id(err_wifi_lost);'

- platform: template
  name: "Error: T1 Sensor Fail (Outside)"
  id: bs_err_t1
  device_class: problem
  lambda: 'return id(err_t1);'

- platform: template
  name: "Error: T2 Sensor Fail (Gas Inlet)"
  id: bs_err_t2
  device_class: problem
  lambda: 'return id(err_t2);'

- platform: template
  name: "Error: T3 Sensor Fail (Chassis)"
  id: bs_err_t3
  device_class: problem
  lambda: 'return id(err_t3);'

- platform: template
  name: "Error: T4 Sensor Fail (Drain)"
  id: bs_err_t4
  device_class: problem
  lambda: 'return id(err_t4);'

# Generic error active indicator (any error)
- platform: template
  name: "System Error Active"
  id: bs_any_error
  device_class: problem
  lambda: |-
    return id(err_wifi_lost) || id(err_t1) || id(err_t2) || id(err_t3) || id(err_t4);

# ======================== DIGITAL OUTPUTS ========================
output:
# DO1: SSR – Chassis heater (GPIO32)
- platform: gpio
  id: do1_chassis_out
  pin:
    number: GPIO32
    inverted: false

# DO2: SSR – Drain heater (GPIO33)
- platform: gpio
  id: do2_drain_out
  pin:
    number: GPIO33
    inverted: false

# DO3: OC 5/12V (GPIO25) – reserved
- platform: gpio
  id: do3_oc_out
  pin:
    number: GPIO25
    inverted: false

# DO4: OC 5/12V (GPIO26) – reserved
- platform: gpio
  id: do4_oc_out
  pin:
    number: GPIO26
    inverted: false

# WD (GPIO4) and ERR (GPIO2) LEDs are driven directly by led_sequencer (ADR-004,
# below) — it owns the GPIO via ESP-IDF driver/gpio.h, not the output: platform.

# ======================== LED SEQUENCER (ADR-004) ========================
# Ported from Garage_Windows beze změny enginu (OI10). Two instances, declarative
# patterns, driven by `set_pattern(id, bool)` calls from the intervals below —
# replaces the old blocking-delay show_error_code script and manual WD interval.
led_sequencer:
# Instance #1 — ERR LED (GPIO2), strapping pin safe via BSS138.
# "default" mode patterns play serially when multiple are active at once
# (F3: gaps 1500/2000ms). Declared in README error-code order (§Zdůvodnění
# ADR-004: number by README order, not frequency like Windows ADR-010).
- id: err_led_seq
  output_pin: 2
  inter_pattern_gap_ms: 1500
  end_of_frame_gap_ms: 2000
  patterns:
  - id: err_wifi
    sequence:
    - { on_ms: 300, off_ms: 300, repeat: 1 }
  - id: err_t1
    sequence:
    - { on_ms: 300, off_ms: 300, repeat: 2 }
  - id: err_t2
    sequence:
    - { on_ms: 300, off_ms: 300, repeat: 3 }
  - id: err_t3
    sequence:
    - { on_ms: 300, off_ms: 300, repeat: 4 }
  - id: err_t4
    sequence:
    - { on_ms: 300, off_ms: 300, repeat: 5 }

# Instance #2 — WD LED (GPIO4). All four states are `continuous` and mutually
# exclusive (selector lambda below ensures exactly one is active) — priority
# order top-to-bottom matches the engine's find_continuous_active_() scan order.
- id: wd_led_seq
  output_pin: 4
  patterns:
  - id: wd_disabled
    mode: continuous
    sequence:
    - { on_ms: 100, off_ms: 900 }
  - id: wd_defrost
    mode: continuous
    sequence:
    - { on_ms: 100, off_ms: 100 }
  - id: wd_armed
    # 2×(150/150) then an extra 900ms off before repeating — the trailing gap
    # is folded into the 2nd step's off_ms (150 + 900 = 1050), since a Step's
    # on_ms must be >=1 (no bare "off-only" step in the schema).
    mode: continuous
    sequence:
    - { on_ms: 150, off_ms: 150 }
    - { on_ms: 150, off_ms: 1050 }
  - id: wd_idle
    mode: continuous
    sequence:
    - { on_ms: 500, off_ms: 500 }

# ======================== SWITCHES ========================
switch:
# MAIN SYSTEM SWITCH
# Enables/disables entire system (maintenance/summer mode)
# BUG-001: default switch restore_mode is ALWAYS_OFF (esphome/components/switch,
# not overridden here before this fix) — TemplateSwitch::setup() acts on that on
# every boot, firing turn_off_action and resetting main_system_enabled to false
# regardless of its own restore_value: true. DISABLED = state comes purely from
# the lambda (which already reads the correctly-restored global); no action
# fires at boot.
- platform: template
  name: "Main System Enable"
  id: sw_main_system_enable
  optimistic: false
  restore_mode: DISABLED
  lambda: |-
    // Reflect the actual internal state
    return id(main_system_enabled);
  turn_on_action:
  - lambda: |-
      id(main_system_enabled) = true;
      // System logic will resume automatically
  turn_off_action:
  - lambda: |-
      // Disable system and force safe state
      id(main_system_enabled) = false;
      id(defrost_running) = false;
  - script.stop: run_defrost
  - script.stop: defrost_chassis_cycle
  - script.stop: defrost_drain_cycle
  # Force both heaters OFF immediately
  - switch.turn_off: sw_heater_chassis
  - switch.turn_off: sw_heater_drain

# HEATING OUTPUTS (SSR mapped switches)
- platform: output
  name: "Heater Chassis"
  id: sw_heater_chassis
  output: do1_chassis_out
  restore_mode: ALWAYS_OFF

- platform: output
  name: "Heater Drain"
  id: sw_heater_drain
  output: do2_drain_out
  restore_mode: ALWAYS_OFF

# Aux outputs (hidden from HA)
- platform: output
  name: "Aux DO3"
  id: sw_do3
  output: do3_oc_out
  restore_mode: ALWAYS_OFF
  internal: true

- platform: output
  name: "Aux DO4"
  id: sw_do4
  output: do4_oc_out
  restore_mode: ALWAYS_OFF
  internal: true

# SIMULATION CONTROLS
# BUG-001: same fix as Main System Enable above — without restore_mode: DISABLED,
# default ALWAYS_OFF would reset sim_mode_state to false on every boot despite
# its own restore_value: true.
- platform: template
  name: "Simulation Mode"
  id: sim_mode
  optimistic: false
  restore_mode: DISABLED
  lambda: |-
    return id(sim_mode_state);
  # BUG-002: t_outside_used/t_gas_inlet_used/t_chassis_used/t_drain_used each poll on
  # their own independent update_interval: 5s, uncoordinated with this switch or
  # each other. Toggling sim_mode without forcing a synchronized refresh leaves a
  # window (up to 5s) where some _used sensors already reflect the new mode and
  # others still show the old one — e.g. t_gas_inlet_used stale-real (~27C) vs
  # t_outside_used fresh-sim (~5C) — which can spuriously satisfy DEFROST_ORDERED
  # and start a full defrost cycle (floor-guaranteed by ADR-008) for no real
  # reason. Force all four to update together, right after the mode flips, to
  # close that window.
  turn_on_action:
  - lambda: |-
      id(sim_mode_state) = true;
  - component.update: t_outside_used
  - component.update: t_gas_inlet_used
  - component.update: t_chassis_used
  - component.update: t_drain_used
  turn_off_action:
  - lambda: |-
      id(sim_mode_state) = false;
  - component.update: t_outside_used
  - component.update: t_gas_inlet_used
  - component.update: t_chassis_used
  - component.update: t_drain_used

# ======================== SCRIPTS ========================
script:
# Defrost sequence – starts nested scripts and waits for their completion.
  # Retrigger (ADR-008): a fresh DEFROST_ORDERED rising edge is NOT gated on
  # defrost_running anymore — mode: restart on all three scripts means a new
  # edge simply restarts the whole cycle (turn_on on an already-on heater is
  # idempotent). defrost_running is a pure status flag now, not an interlock.
  # Known limitation: a condition oscillating faster than the floor can keep
  # resetting each cycle's ceiling budget, extending heating indefinitely —
  # accepted for now (ADR-008 §8); the ceiling only guards a stuck condition,
  # not a flapping one.
- id: run_defrost
  mode: restart
  then:
  - lambda: 'id(defrost_running) = true;'
  - script.execute: defrost_chassis_cycle
  - script.execute: defrost_drain_cycle
  - wait_until:
      condition:
        lambda: 'return !id(defrost_chassis_cycle).is_running() && !id(defrost_drain_cycle).is_running();'
  - lambda: 'id(defrost_running) = false;'

# Nested script: chassis heater
# ADR-008: two-phase — guaranteed floor (runs regardless of condition), then
# condition-driven until DEFROST_ORDERED drops or the ceiling is reached,
# whichever comes first. chassis_time_floor (default 2 min) protects against
# short-cycling since DEFROST_ORDERED has no hysteresis; chassis_time_ceiling
# (default 20 min, ADR-007) is the fail-safe max against a stuck condition.
- id: defrost_chassis_cycle
  mode: restart
  then:
  - switch.turn_on: sw_heater_chassis
  - delay: !lambda 'return (uint32_t)(id(chassis_time_floor).state * 60000);'
  - wait_until:
      condition:
        lambda: 'return !id(bs_defrost).state;'
      timeout: !lambda |-
        const uint32_t floor_ms = (uint32_t)(id(chassis_time_floor).state * 60000);
        const uint32_t ceiling_ms = (uint32_t)(id(chassis_time_ceiling).state * 60000);
        if (floor_ms >= ceiling_ms) return (uint32_t) 0;
        return ceiling_ms - floor_ms;
  - switch.turn_off: sw_heater_chassis

# Nested script: drain heater
# ADR-008: two-phase — see defrost_chassis_cycle above for rationale.
# drain_time_floor (default 3 min) / drain_time_ceiling (default 20 min, ADR-007).
- id: defrost_drain_cycle
  mode: restart
  then:
  - switch.turn_on: sw_heater_drain
  - delay: !lambda 'return (uint32_t)(id(drain_time_floor).state * 60000);'
  - wait_until:
      condition:
        lambda: 'return !id(bs_defrost).state;'
      timeout: !lambda |-
        const uint32_t floor_ms = (uint32_t)(id(drain_time_floor).state * 60000);
        const uint32_t ceiling_ms = (uint32_t)(id(drain_time_ceiling).state * 60000);
        if (floor_ms >= ceiling_ms) return (uint32_t) 0;
        return ceiling_ms - floor_ms;
  - switch.turn_off: sw_heater_drain

# ======================== INTERVALS ========================
interval:
# WiFi connection monitoring with 5-minute filter
# Detects sustained WiFi loss (ignores brief glitches < 5 min)
# Connected: reset error flag and debounce counter
# Disconnected: increment counter, error flag only after 300 seconds
- interval: 1s
  then:
  - if:
      condition:
        wifi.connected:
      then:
      # WiFi IS connected: reset error and counter
      - lambda: |-
          if (id(err_wifi_lost)) {
            ESP_LOGI("error_detection", "WiFi connection restored");
          }
          id(err_wifi_lost) = false;
          id(wifi_lost_duration_sec) = 0;
      else:
      # WiFi IS DISCONNECTED: increment debounce counter
      - lambda: |-
          id(wifi_lost_duration_sec)++;

          // Only set error flag AFTER 5 minutes (300 seconds) of disconnection
          if (id(wifi_lost_duration_sec) >= 300) {
            if (!id(err_wifi_lost)) {
              id(err_wifi_lost) = true;
              ESP_LOGW("error_detection", "WiFi lost for 5+ minutes!");
            }
          } else {
            // Still waiting for 5-minute threshold
            if (id(wifi_lost_duration_sec) % 60 == 0) {
              // Log every 60 seconds during disconnection period
              ESP_LOGD("error_detection", "WiFi disconnected for %lu sec (threshold: 300 sec)", id(wifi_lost_duration_sec));
            }
          }

# T1 & T2 sensor validity check (update every 20 seconds)
# Detects NaN or missing sensor responses. ADR-004/OI11: split into independent
# err_t1/err_t2, and reads the `_used` layer (not the raw sensor) — so
# Simulation Mode no longer trips a false fail on a physically absent/unread
# real sensor while sim_mode is ON (real mode: `_used` mirrors raw 1:1, so
# real-world fault detection is unchanged).
# Should be fast enough for defrost logic
#
# BUG-004: skip evaluation for the first 10s after boot. Both this interval's
# own first run AND each DS18B20's own first conversion are independently
# scheduled with a random 0-5s offset after boot (ESPHome scheduler default),
# so this check can genuinely run before T1/T2 ever published a value (default
# sensor state is NAN until the first publish) — a false "failure" that then
# sticks for up to 5 refresh cycles thanks to the median filter's
# send_first_at:1/send_every:5 timing (see BUGS.md BUG-004). 10s covers the
# worst case (5s scheduler offset + 750ms conversion + margin) and only
# applies once, right after boot — no impact on real-fault detection speed.
- interval: 20s
  then:
  - if:
      condition:
        lambda: 'return millis() >= 10000;'
      then:
      - lambda: |-
          bool new_err_t1 = isnan(id(t_outside_used).state);
          bool new_err_t2 = isnan(id(t_gas_inlet_used).state);

          if (new_err_t1 != id(err_t1)) {
            id(err_t1) = new_err_t1;
            if (new_err_t1) {
              ESP_LOGW("error_detection", "T1 (outside) sensor failure detected!");
            } else {
              ESP_LOGI("error_detection", "T1 (outside) sensor recovered");
            }
          }
          if (new_err_t2 != id(err_t2)) {
            id(err_t2) = new_err_t2;
            if (new_err_t2) {
              ESP_LOGW("error_detection", "T2 (gas inlet) sensor failure detected!");
            } else {
              ESP_LOGI("error_detection", "T2 (gas inlet) sensor recovered");
            }
          }

# T3 & T4 sensor validity check (update every 60 seconds)
# Detects NaN or missing sensor responses. ADR-004/OI11: same split + `_used`
# read as T1/T2 above.
# Not Critical for safety, informational only
#
# BUG-004: same startup-grace fix as the T1/T2 check above.
- interval: 60s
  then:
  - if:
      condition:
        lambda: 'return millis() >= 10000;'
      then:
      - lambda: |-
          bool new_err_t3 = isnan(id(t_chassis_used).state);
          bool new_err_t4 = isnan(id(t_drain_used).state);

          if (new_err_t3 != id(err_t3)) {
            id(err_t3) = new_err_t3;
            if (new_err_t3) {
              ESP_LOGW("error_detection", "T3 (chassis) sensor failure detected!");
            } else {
              ESP_LOGI("error_detection", "T3 (chassis) sensor recovered");
            }
          }
          if (new_err_t4 != id(err_t4)) {
            id(err_t4) = new_err_t4;
            if (new_err_t4) {
              ESP_LOGW("error_detection", "T4 (drain) sensor failure detected!");
            } else {
              ESP_LOGI("error_detection", "T4 (drain) sensor recovered");
            }
          }

# Edge trigger: start/restart defrost on rising DEFROST_ORDERED
# Detects transition from false→true and launches defrost cycle
#
# ADR-006 (boot-resume, variant B): `static bool last` resets to false on every
# reboot. If DEFROST_ORDERED is already true the first time this evaluates after
# boot, it reads as a rising edge and defrost auto-resumes — this is intentional,
# not a bug. No explicit on_boot resume is added on purpose (see ADR-006). Worst
# case is missing one in-progress defrost cycle across a reboot, bounded by how
# long DS18B20 sensors take to report valid data again (~1 poll interval once
# send_first_at: 1 is set, OI12 — was ~10 min before that fix).
#
# ADR-008: no longer gated on `!defrost_running` — a fresh rising edge always
# restarts run_defrost (mode: restart handles re-entry safely, see comment
# there). This lets a faster-ceiling heater re-arm on a new edge even while a
# slower one is still finishing its own cycle.
- interval: 1s
  then:
  - if:
      condition:
        lambda: |-
          static bool last = false;
          const bool now = id(bs_defrost).state;
          const bool rising = (!last && now);
          last = now;

          // Start/restart whenever the system is enabled and a fresh edge occurs
          return id(main_system_enabled) && rising;
      then:
      - script.execute: run_defrost

# ERR LED (ADR-004): evaluate all error sources every 500ms, activate/
# deactivate led_sequencer patterns. Multiple active errors play serially
# (engine handles the 1500/2000ms gaps, see led_sequencer: config above).
- interval: 500ms
  then:
  - lambda: |-
      id(err_led_seq).set_pattern("err_wifi", id(err_wifi_lost));
      id(err_led_seq).set_pattern("err_t1",   id(err_t1));
      id(err_led_seq).set_pattern("err_t2",   id(err_t2));
      id(err_led_seq).set_pattern("err_t3",   id(err_t3));
      id(err_led_seq).set_pattern("err_t4",   id(err_t4));

# WD LED (ADR-004): selector lambda picks exactly one continuous pattern —
# priority: disabled > defrost > armed > idle.
# Main switch OFF → disabled; heater running → defrost; HEAT_MODE armed with
# no heater → armed; otherwise → idle.
- interval: 500ms
  then:
  - lambda: |-
      bool main_on    = id(main_system_enabled);
      bool heater_on  = id(sw_heater_chassis).state || id(sw_heater_drain).state;
      bool heat_armed = id(bs_heat_mode).state;

      id(wd_led_seq).set_pattern("wd_disabled", !main_on);
      id(wd_led_seq).set_pattern("wd_defrost",  main_on && heater_on);
      id(wd_led_seq).set_pattern("wd_armed",    main_on && !heater_on && heat_armed);
      id(wd_led_seq).set_pattern("wd_idle",     main_on && !heater_on && !heat_armed);

# Dynamic DS18B20 polling: on-demand fast refresh
# HEAT_MODE active → refresh Gas Inlet (T2) every 5 s (base is 20s, see sensor:
# above — this is the "fast tier" while defrost detection actually matters).
#
# BUG-003 (S5, 2026-07-30): this used to be `interval: 1s`, firing
# component.update every second — far faster than the ~750ms (12-bit) DS18B20
# conversion time, causing overlapping convert/read cycles on the shared
# 1-Wire bus (checksum-invalid scratch pad reads, occasional collision-induced
# NaN on T1's own read). Fixed by setting the interval period to actually
# match the stated 5 s cadence, instead of hammering every tick.
- interval: 5s
  then:
  - if:
      condition:
        binary_sensor.is_on: bs_heat_mode
      then:
      - component.update: t_gas_inlet

# Any heater ON → fast-refresh Chassis (T3) & Drain (T4) every 5 s (base is
# 20s, see sensor: above). BUG-006 (S10, 2026-07-31): was 20s here, same as
# the new base — redundant, so bumped to 5s to match T2's fast tier and give
# genuinely faster feedback while heating is actually running.
- interval: 5s
  then:
  - if:
      condition:
        or:
        - switch.is_on: sw_heater_chassis
        - switch.is_on: sw_heater_drain
      then:
      - component.update: t_chassis
      - component.update: t_drain

# ======================== USER SETTINGS (HA-editable) ========================
# All thresholds and timers are adjustable from Home Assistant
# Values persist across reboots via restore_value: true
number:
# HEAT_MODE thresholds
# Enable when outside temp ≤ this value
- platform: template
  name: "Heat Enable Threshold (°C)"
  id: heat_on_th
  min_value: -20
  max_value: 10
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 2.0

# Disable when outside temp ≥ this value
- platform: template
  name: "Heat Disable Threshold (°C)"
  id: heat_off_th
  min_value: -10
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 4.0

# DEFROST detection thresholds
# Absolute threshold: evaporator temp must be ≥ this value
- platform: template
  name: "Defrost Evap Abs Threshold (°C)"
  id: def_abs_th
  min_value: -10
  max_value: 30
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5.0

# Delta threshold: (evaporator - outside) must be ≥ this value
- platform: template
  name: "Defrost Delta Threshold (°C)"
  id: def_dt_th
  min_value: 0
  max_value: 20
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 7.0

# Heater timing (minutes) — two-tier: floor (guaranteed min) + ceiling (safety
# max), ADR-008. Heater runs the floor unconditionally, then follows
# DEFROST_ORDERED until it drops or the ceiling is hit, whichever comes first.
# Chassis heater: guaranteed minimum run time (floor) — protects against
# short-cycling since DEFROST_ORDERED has no hysteresis.
- platform: template
  name: "Chassis Heater Min Time (min)"
  id: chassis_time_floor
  min_value: 1
  max_value: 10
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 2

# Drain heater: guaranteed minimum run time (floor)
- platform: template
  name: "Drain Heater Min Time (min)"
  id: drain_time_floor
  min_value: 1
  max_value: 10
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 3

# Chassis heater: max activation duration (ceiling — fail-safe against a stuck
# condition, ADR-007/008). Range 15-60 keeps floor < ceiling structurally true.
- platform: template
  name: "Chassis Heater Time (min)"
  id: chassis_time_ceiling
  min_value: 15
  max_value: 60
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 20

# Drain heater: max activation duration (ceiling)
- platform: template
  name: "Drain Heater Time (min)"
  id: drain_time_ceiling
  min_value: 15
  max_value: 60
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 20

# SIMULATION CONTROLS (for testing without hardware)
# Manual outside temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Outside (°C)"
  id: sim_t_outside
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 10

# Manual gas inlet temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Gas Inlet (°C)"
  id: sim_t_gas_inlet
  min_value: -5
  max_value: 25
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5

# Manual chassis temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Chassis (°C)"
  id: sim_t_chassis
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5

# Manual drain temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Drain (°C)"
  id: sim_t_drain
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5
