# ===================== GARAGE_DRAIN_DEFROST (ESP32-WROOM-32UE) =====================
# NOTE: This version includes:
#  1) Dynamic DS18B20 polling (base 60s, on-demand refresh 5s/20s)
#  2) Simulation mode (override temperatures from UI/HA without recompiling)
#     -> "(used)" sensors feed the logic (real vs simulated values)
#  3) ERROR DETECTION SYSTEM with WiFi & sensor failure monitoring
#     -> 5-minute WiFi filter (ignores brief glitches)
#     -> Concurrent error exposure to HA
#     -> Individual binary sensors + human-readable text status
#     -> Error LED with pulse patterns (1x/2x/3x for each error type)
# ------------------------------------------------------------------------------------
esphome:
  name: esp-garage-drain-defrost
  friendly_name: "Garage Drain Defrost"
  comment: !secret device_comment
  build_path: "D:/Code/VSCode_Programs/ESP32/GARAGE_DRAIN_DEFROST/firmware/.esphome"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none # critical for stable API/logs
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1
  ap:
    ssid: !secret fallback

# Web UI for quick checks & simulation controls
web_server:
  port: 80
  version: 2

# ------------------------ 1‑Wire BUS (shared) ------------------------
one_wire:
- platform: gpio
  pin: GPIO21 # shared DS18B20 bus

# ======================== GLOBALS ========================
globals:
# Error flags: individual booleans for each error type
# WiFi connection lost (filtered: 5 min of sustained disconnection)
- id: err_wifi_lost
  type: bool
  restore_value: false
  initial_value: 'false'

# T1 (outside) or T2 (evaporator) sensor failure (NaN detected)
- id: err_t1_t2_fail
  type: bool
  restore_value: false
  initial_value: 'false'

# T3 (chassis) or T4 (drain) sensor failure (NaN detected)
- id: err_t3_t4_fail
  type: bool
  restore_value: false
  initial_value: 'false'

# WiFi error debounce counter (seconds since disconnect)
# Seconds elapsed since WiFi was lost (used for 5-min filter: 300 sec)
- id: wifi_lost_duration_sec
  type: uint32_t
  restore_value: false
  initial_value: '0'

# Defrost state flag
# True when defrost cycle is actively running
- id: defrost_running
  type: bool
  restore_value: false
  initial_value: 'false'

# Simulation Mode persistent flag
# Enable/disable simulation mode (true=simulated temps, false=real sensors)
- id: sim_mode_state
  type: bool
  restore_value: true
  initial_value: 'false'

# Main system switch
# Enable/disable entire system (maintenance/summer mode)
- id: main_system_enabled
  type: bool
  restore_value: true
  initial_value: 'true'

# ======================== SENSORS ========================
sensor:
# Outside Temperature (T1)
- platform: dallas_temp
  address: 0x3400000051876f28 # commissioned S5 2026-07-28 (test01 HW bring-up)
  name: "Outside Temperature"
  id: t_outside
  update_interval: 120s
  accuracy_decimals: 1
  filters:
    median:
      window_size: 5
      send_every: 5
      send_first_at: 1 # OI12/ADR-006: publish after 1st sample, not after full window
                        # (was ~10 min blind window after every boot -> false T1/T2,
                        # T3/T4 error flags; now ~1 poll interval)

    # Toshiba Evaporator (T2)
- platform: dallas_temp
  address: 0xab030a9794259928 # commissioned S5 2026-07-28 (test01 HW bring-up)
  name: "Evaporator Temperature"
  id: t_evap
  update_interval: 120s
  accuracy_decimals: 1
  filters:
    median:
      window_size: 5
      send_every: 5
      send_first_at: 1 # OI12/ADR-006: publish after 1st sample, not after full window
                        # (was ~10 min blind window after every boot -> false T1/T2,
                        # T3/T4 error flags; now ~1 poll interval)

    # Toshiba Chassis (T3)
- platform: dallas_temp
  address: 0x3 # TODO: replace with real address
  name: "Chassis Temperature"
  id: t_chassis
  update_interval: 120s
  accuracy_decimals: 1
  filters:
    median:
      window_size: 5
      send_every: 5
      send_first_at: 1 # OI12/ADR-006: publish after 1st sample, not after full window
                        # (was ~10 min blind window after every boot -> false T1/T2,
                        # T3/T4 error flags; now ~1 poll interval)

    # Drain Pipe (T4)
- platform: dallas_temp
  address: 0x4 # TODO: replace with real address
  name: "Drain Pipe Temperature"
  id: t_drain
  update_interval: 120s
  accuracy_decimals: 1
  filters:
    median:
      window_size: 5
      send_every: 5
      send_first_at: 1 # OI12/ADR-006: publish after 1st sample, not after full window
                        # (was ~10 min blind window after every boot -> false T1/T2,
                        # T3/T4 error flags; now ~1 poll interval)

    # "USED" sensors: logic consumes these; they switch between real & simulated
    # values depending on Simulation Mode (switch sim_mode).
- platform: template
  name: "Outside Temperature (used)"
  id: t_outside_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode).state) {
      return id(sim_t_outside).state;
    } else {
      return id(t_outside).state;
    }

- platform: template
  name: "Evaporator Temperature (used)"
  id: t_evap_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode).state) {
      return id(sim_t_evap).state;
    } else {
      return id(t_evap).state;
    }

- platform: template
  name: "Chassis Temperature (used)"
  id: t_chassis_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode).state) {
      return id(sim_t_chassis).state;
    } else {
      return id(t_chassis).state;
    }

- platform: template
  name: "Drain Pipe Temperature (used)"
  id: t_drain_used
  unit_of_measurement: "°C"
  accuracy_decimals: 1
  update_interval: 5s
  lambda: |-
    if (id(sim_mode).state) {
      return id(sim_t_drain).state;
    } else {
      return id(t_drain).state;
    }

# ======================== TEXT SENSORS ========================
# Human-readable error status for HA dashboard
# Shows ALL concurrent errors as comma-separated list
# Update interval: 60s (reduced traffic to HA)
text_sensor:
- platform: template
  name: "Error Status"
  id: sensor_error_status
  update_interval: 60s
  lambda: |-
    // Build comma-separated list of ALL active errors
    std::string status = "OK";
    std::vector<std::string> active_errors;

    if (id(err_wifi_lost)) {
      active_errors.push_back("WiFi Lost");
    }
    if (id(err_t1_t2_fail)) {
      active_errors.push_back("T1/T2 Fail");
    }
    if (id(err_t3_t4_fail)) {
      active_errors.push_back("T3/T4 Fail");
    }

    if (!active_errors.empty()) {
      status = "";
      for (size_t i = 0; i < active_errors.size(); i++) {
        status += active_errors[i];
        if (i < active_errors.size() - 1) {
          status += ", ";  // comma-separated list
        }
      }
    }
    return status;

# ======================== BINARY SENSORS ========================
binary_sensor:
# DI1 (GPIO36) — Reserved
- platform: gpio
  id: di1_in
  name: "DI1 (Reserved)"
  pin:
    number: GPIO36
  filters:
  - delayed_on: 30ms
  - delayed_off: 30ms
  internal: true
  on_press:
  - logger.log: "DI1: PRESSED"
  on_release:
  - logger.log: "DI1: RELEASED"

# DI2 (GPIO39) — Reserved
- platform: gpio
  id: di2_in
  name: "DI2 (Reserved)"
  pin:
    number: GPIO39
  filters:
  - delayed_on: 30ms
  - delayed_off: 30ms
  internal: true
  on_press:
  - logger.log: "DI2: PRESSED"
  on_release:
  - logger.log: "DI2: RELEASED"

# HEAT_MODE (uses OUTSIDE (used) & thresholds)
# Enabled when outside temp ≤ heat_on_th
# Disabled when outside temp ≥ heat_off_th
# Hysteresis: dual thresholds prevent oscillation
- platform: template
  name: "HEAT_MODE"
  id: bs_heat_mode
  device_class: cold
  lambda: |-
    // If main system is disabled, HEAT_MODE is always OFF
    if (!id(main_system_enabled)) {
      return false;
    }

    if (!isnan(id(t_outside_used).state) &&
        !isnan(id(heat_on_th).state) &&
        !isnan(id(heat_off_th).state)) {
      static bool heat = false;
      const float t = id(t_outside_used).state;
      if (t <= id(heat_on_th).state) heat = true;
      if (t >= id(heat_off_th).state) heat = false;
      return heat;
    }
    return {};

# DEFROST_ORDERED (uses EVAP (used), OUTSIDE (used) & thresholds)
# Triggered when:
#   1) T2 (evaporator) ≥ def_abs_th AND
#   2) ΔT = (T2 - T1) ≥ def_dt_th AND
#   3) HEAT_MODE is armed (ADR-009: freeze-relevance gate)
# All three conditions required (AND logic)
- platform: template
  name: "DEFROST_ORDERED"
  id: bs_defrost
  lambda: |-
    // If main system is disabled, defrost request is always OFF
    if (!id(main_system_enabled)) {
      return false;
    }

    if (!isnan(id(t_evap_used).state) &&
        !isnan(id(t_outside_used).state) &&
        !isnan(id(def_abs_th).state) &&
        !isnan(id(def_dt_th).state)) {
      const float te = id(t_evap_used).state;
      const float to = id(t_outside_used).state;
      const bool abs_ok = te >= id(def_abs_th).state;
      const bool dt_ok  = (te - to) >= id(def_dt_th).state;
      return abs_ok && dt_ok && id(bs_heat_mode).state;   // ADR-009
    }
    return {};

# Individual error binary sensors for HA exposure
# These allow concurrent error detection (all shown independently)
- platform: template
  name: "Error: WiFi Lost"
  id: bs_err_wifi_lost
  device_class: problem
  lambda: 'return id(err_wifi_lost);'

- platform: template
  name: "Error: T1 or T2 Sensor Fail"
  id: bs_err_t1_t2
  device_class: problem
  lambda: 'return id(err_t1_t2_fail);'

- platform: template
  name: "Error: T3 or T4 Sensor Fail"
  id: bs_err_t3_t4
  device_class: problem
  lambda: 'return id(err_t3_t4_fail);'

# Generic error active indicator (any error)
- platform: template
  name: "System Error Active"
  id: bs_any_error
  device_class: problem
  lambda: |-
    return id(err_wifi_lost) || id(err_t1_t2_fail) || id(err_t3_t4_fail);

# ======================== DIGITAL OUTPUTS ========================
output:
# DO1: SSR – Chassis heater (GPIO32)
- platform: gpio
  id: do1_chassis_out
  pin:
    number: GPIO32
    inverted: false

# DO2: SSR – Drain heater (GPIO33)
- platform: gpio
  id: do2_drain_out
  pin:
    number: GPIO33
    inverted: false

# DO3: OC 5/12V (GPIO25) – reserved
- platform: gpio
  id: do3_oc_out
  pin:
    number: GPIO25
    inverted: false

# DO4: OC 5/12V (GPIO26) – reserved
- platform: gpio
  id: do4_oc_out
  pin:
    number: GPIO26
    inverted: false

# WD LED (GPIO4) – HIGH = LED ON (watchdog heartbeat)
- platform: gpio
  id: led_wd
  pin:
    number: GPIO4
    inverted: false

# ERR LED (GPIO2) – HIGH = LED ON (strapping pin safe via BSS138)
- platform: gpio
  id: led_err
  pin:
    number: GPIO2
    inverted: false

# ======================== SWITCHES ========================
switch:
# MAIN SYSTEM SWITCH
# Enables/disables entire system (maintenance/summer mode)
# BUG-001: default switch restore_mode is ALWAYS_OFF (esphome/components/switch,
# not overridden here before this fix) — TemplateSwitch::setup() acts on that on
# every boot, firing turn_off_action and resetting main_system_enabled to false
# regardless of its own restore_value: true. DISABLED = state comes purely from
# the lambda (which already reads the correctly-restored global); no action
# fires at boot.
- platform: template
  name: "Main System Enable"
  id: sw_main_system_enable
  optimistic: false
  restore_mode: DISABLED
  lambda: |-
    // Reflect the actual internal state
    return id(main_system_enabled);
  turn_on_action:
  - lambda: |-
      id(main_system_enabled) = true;
      // System logic will resume automatically
  turn_off_action:
  - lambda: |-
      // Disable system and force safe state
      id(main_system_enabled) = false;
      id(defrost_running) = false;
  - script.stop: run_defrost
  - script.stop: defrost_chassis_cycle
  - script.stop: defrost_drain_cycle
  # Force both heaters OFF immediately
  - switch.turn_off: sw_heater_chassis
  - switch.turn_off: sw_heater_drain

# HEATING OUTPUTS (SSR mapped switches)
- platform: output
  name: "Heater Chassis"
  id: sw_heater_chassis
  output: do1_chassis_out
  restore_mode: ALWAYS_OFF

- platform: output
  name: "Heater Drain"
  id: sw_heater_drain
  output: do2_drain_out
  restore_mode: ALWAYS_OFF

# Aux outputs (hidden from HA)
- platform: output
  name: "Aux DO3"
  id: sw_do3
  output: do3_oc_out
  restore_mode: ALWAYS_OFF
  internal: true

- platform: output
  name: "Aux DO4"
  id: sw_do4
  output: do4_oc_out
  restore_mode: ALWAYS_OFF
  internal: true

# SIMULATION CONTROLS
# BUG-001: same fix as Main System Enable above — without restore_mode: DISABLED,
# default ALWAYS_OFF would reset sim_mode_state to false on every boot despite
# its own restore_value: true.
- platform: template
  name: "Simulation Mode"
  id: sim_mode
  optimistic: false
  restore_mode: DISABLED
  lambda: |-
    return id(sim_mode_state);
  # BUG-002: t_outside_used/t_evap_used/t_chassis_used/t_drain_used each poll on
  # their own independent update_interval: 5s, uncoordinated with this switch or
  # each other. Toggling sim_mode without forcing a synchronized refresh leaves a
  # window (up to 5s) where some _used sensors already reflect the new mode and
  # others still show the old one — e.g. t_evap_used stale-real (~27C) vs
  # t_outside_used fresh-sim (~5C) — which can spuriously satisfy DEFROST_ORDERED
  # and start a full defrost cycle (floor-guaranteed by ADR-008) for no real
  # reason. Force all four to update together, right after the mode flips, to
  # close that window.
  turn_on_action:
  - lambda: |-
      id(sim_mode_state) = true;
  - component.update: t_outside_used
  - component.update: t_evap_used
  - component.update: t_chassis_used
  - component.update: t_drain_used
  turn_off_action:
  - lambda: |-
      id(sim_mode_state) = false;
  - component.update: t_outside_used
  - component.update: t_evap_used
  - component.update: t_chassis_used
  - component.update: t_drain_used

# ======================== SCRIPTS ========================
script:
# Error LED controller with pulse patterns
# Shows each active error with distinct pulse count:
#   WiFi Lost        → 1 pulse (200ms ON, 1s OFF)
#   T1/T2 Fail       → 2 pulses (200ms ON, 200ms OFF, repeated 2x + 1s OFF)
#   T3/T4 Fail       → 3 pulses (200ms ON, 200ms OFF, repeated 3x + 1s OFF)
# Multiple errors shown sequentially in 10-second cycle started by interval
- id: show_error_code
  mode: restart
  then:
  - logger.log:
      format: "show_error_code triggered: WiFi=%d, T1/T2=%d, T3/T4=%d"
      args: [ id(err_wifi_lost), id(err_t1_t2_fail), id(err_t3_t4_fail) ]

  # Show WiFi error (1 pulse)
  - if:
      condition:
        lambda: 'return id(err_wifi_lost);'
      then:
      - output.turn_on: led_err
      - delay: 200ms
      - output.turn_off: led_err
      - delay: 1s

  # Show T1/T2 error (2 pulses)
  - if:
      condition:
        lambda: 'return id(err_t1_t2_fail);'
      then:
      - repeat:
          count: 2
          then:
          - output.turn_on: led_err
          - delay: 200ms
          - output.turn_off: led_err
          - delay: 200ms
      - delay: 0.8s # gap after T1/T2 pattern

  # Show T3/T4 error (3 pulses)
  - if:
      condition:
        lambda: 'return id(err_t3_t4_fail);'
      then:
      - repeat:
          count: 3
          then:
          - output.turn_on: led_err
          - delay: 200ms
          - output.turn_off: led_err
          - delay: 200ms
      - delay: 0.8s # gap after T3/T4 pattern
  # Placeholder for next errors (if added in future)    

  # Defrost sequence – starts nested scripts and waits for their completion.
  # Retrigger (ADR-008): a fresh DEFROST_ORDERED rising edge is NOT gated on
  # defrost_running anymore — mode: restart on all three scripts means a new
  # edge simply restarts the whole cycle (turn_on on an already-on heater is
  # idempotent). defrost_running is a pure status flag now, not an interlock.
  # Known limitation: a condition oscillating faster than the floor can keep
  # resetting each cycle's ceiling budget, extending heating indefinitely —
  # accepted for now (ADR-008 §8); the ceiling only guards a stuck condition,
  # not a flapping one.
- id: run_defrost
  mode: restart
  then:
  - lambda: 'id(defrost_running) = true;'
  - script.execute: defrost_chassis_cycle
  - script.execute: defrost_drain_cycle
  - wait_until:
      condition:
        lambda: 'return !id(defrost_chassis_cycle).is_running() && !id(defrost_drain_cycle).is_running();'
  - lambda: 'id(defrost_running) = false;'

# Nested script: chassis heater
# ADR-008: two-phase — guaranteed floor (runs regardless of condition), then
# condition-driven until DEFROST_ORDERED drops or the ceiling is reached,
# whichever comes first. chassis_time_floor (default 2 min) protects against
# short-cycling since DEFROST_ORDERED has no hysteresis; chassis_time_ceiling
# (default 20 min, ADR-007) is the fail-safe max against a stuck condition.
- id: defrost_chassis_cycle
  mode: restart
  then:
  - switch.turn_on: sw_heater_chassis
  - delay: !lambda 'return (uint32_t)(id(chassis_time_floor).state * 60000);'
  - wait_until:
      condition:
        lambda: 'return !id(bs_defrost).state;'
      timeout: !lambda |-
        const uint32_t floor_ms = (uint32_t)(id(chassis_time_floor).state * 60000);
        const uint32_t ceiling_ms = (uint32_t)(id(chassis_time_ceiling).state * 60000);
        if (floor_ms >= ceiling_ms) return (uint32_t) 0;
        return ceiling_ms - floor_ms;
  - switch.turn_off: sw_heater_chassis

# Nested script: drain heater
# ADR-008: two-phase — see defrost_chassis_cycle above for rationale.
# drain_time_floor (default 3 min) / drain_time_ceiling (default 20 min, ADR-007).
- id: defrost_drain_cycle
  mode: restart
  then:
  - switch.turn_on: sw_heater_drain
  - delay: !lambda 'return (uint32_t)(id(drain_time_floor).state * 60000);'
  - wait_until:
      condition:
        lambda: 'return !id(bs_defrost).state;'
      timeout: !lambda |-
        const uint32_t floor_ms = (uint32_t)(id(drain_time_floor).state * 60000);
        const uint32_t ceiling_ms = (uint32_t)(id(drain_time_ceiling).state * 60000);
        if (floor_ms >= ceiling_ms) return (uint32_t) 0;
        return ceiling_ms - floor_ms;
  - switch.turn_off: sw_heater_drain

# ======================== INTERVALS ========================
interval:
# WiFi connection monitoring with 5-minute filter
# Detects sustained WiFi loss (ignores brief glitches < 5 min)
# Connected: reset error flag and debounce counter
# Disconnected: increment counter, error flag only after 300 seconds
- interval: 1s
  then:
  - if:
      condition:
        wifi.connected:
      then:
      # WiFi IS connected: reset error and counter
      - lambda: |-
          if (id(err_wifi_lost)) {
            ESP_LOGI("error_detection", "WiFi connection restored");
          }
          id(err_wifi_lost) = false;
          id(wifi_lost_duration_sec) = 0;
      else:
      # WiFi IS DISCONNECTED: increment debounce counter
      - lambda: |-
          id(wifi_lost_duration_sec)++;

          // Only set error flag AFTER 5 minutes (300 seconds) of disconnection
          if (id(wifi_lost_duration_sec) >= 300) {
            if (!id(err_wifi_lost)) {
              id(err_wifi_lost) = true;
              ESP_LOGW("error_detection", "WiFi lost for 5+ minutes!");
            }
          } else {
            // Still waiting for 5-minute threshold
            if (id(wifi_lost_duration_sec) % 60 == 0) {
              // Log every 60 seconds during disconnection period
              ESP_LOGD("error_detection", "WiFi disconnected for %lu sec (threshold: 300 sec)", id(wifi_lost_duration_sec));
            }
          }

# T1 & T2 sensor validity check (update every 20 seconds)
# Detects NaN or missing sensor responses
# Should be fast enough for defrost logic
#
# BUG-004: skip evaluation for the first 10s after boot. Both this interval's
# own first run AND each DS18B20's own first conversion are independently
# scheduled with a random 0-5s offset after boot (ESPHome scheduler default),
# so this check can genuinely run before T1/T2 ever published a value (default
# sensor state is NAN until the first publish) — a false "failure" that then
# sticks for up to 5 refresh cycles thanks to the median filter's
# send_first_at:1/send_every:5 timing (see BUGS.md BUG-004). 10s covers the
# worst case (5s scheduler offset + 750ms conversion + margin) and only
# applies once, right after boot — no impact on real-fault detection speed.
- interval: 20s
  then:
  - if:
      condition:
        lambda: 'return millis() >= 10000;'
      then:
      - lambda: |-
          bool t1_valid = !isnan(id(t_outside).state);
          bool t2_valid = !isnan(id(t_evap).state);
          bool should_error = !t1_valid || !t2_valid;

          if (should_error != id(err_t1_t2_fail)) {
            id(err_t1_t2_fail) = should_error;
            if (should_error) {
              ESP_LOGW("error_detection", "T1/T2 sensor failure detected! T1_valid=%d, T2_valid=%d", t1_valid, t2_valid);
            } else {
              ESP_LOGI("error_detection", "T1/T2 sensors recovered");
            }
          }

# T3 & T4 sensor validity check (update every 60 seconds)
# Detects NaN or missing sensor responses
# Not Critical for safety, informational only
#
# BUG-004: same startup-grace fix as the T1/T2 check above.
- interval: 60s
  then:
  - if:
      condition:
        lambda: 'return millis() >= 10000;'
      then:
      - lambda: |-
          bool t3_valid = !isnan(id(t_chassis).state);
          bool t4_valid = !isnan(id(t_drain).state);
          bool should_error = !t3_valid || !t4_valid;

          if (should_error != id(err_t3_t4_fail)) {
            id(err_t3_t4_fail) = should_error;
            if (should_error) {
              ESP_LOGW("error_detection", "T3/T4 sensor failure detected! T3_valid=%d, T4_valid=%d", t3_valid, t4_valid);
            } else {
              ESP_LOGI("error_detection", "T3/T4 sensors recovered");
            }
          }

# Edge trigger: start/restart defrost on rising DEFROST_ORDERED
# Detects transition from false→true and launches defrost cycle
#
# ADR-006 (boot-resume, variant B): `static bool last` resets to false on every
# reboot. If DEFROST_ORDERED is already true the first time this evaluates after
# boot, it reads as a rising edge and defrost auto-resumes — this is intentional,
# not a bug. No explicit on_boot resume is added on purpose (see ADR-006). Worst
# case is missing one in-progress defrost cycle across a reboot, bounded by how
# long DS18B20 sensors take to report valid data again (~1 poll interval once
# send_first_at: 1 is set, OI12 — was ~10 min before that fix).
#
# ADR-008: no longer gated on `!defrost_running` — a fresh rising edge always
# restarts run_defrost (mode: restart handles re-entry safely, see comment
# there). This lets a faster-ceiling heater re-arm on a new edge even while a
# slower one is still finishing its own cycle.
- interval: 1s
  then:
  - if:
      condition:
        lambda: |-
          static bool last = false;
          const bool now = id(bs_defrost).state;
          const bool rising = (!last && now);
          last = now;

          // Start/restart whenever the system is enabled and a fresh edge occurs
          return id(main_system_enabled) && rising;
      then:
      - script.execute: run_defrost

# Error LED controller - trigger error display with pulse patterns
# Runs every 10 seconds to show current error state
- interval: 10s
  then:
  - script.execute: show_error_code

# Watchdog LED (1 Hz heartbeat)
# Main switch ON: 500ms ON / 500ms OFF
# Main switch OFF: 100ms ON / 900ms OFF
- interval: 1s
  then:
  - output.turn_on: led_wd
  - if:
      condition:
        lambda: 'return id(main_system_enabled);'
      then:
      - delay: 500ms
      else:
      - delay: 100ms
  - output.turn_off: led_wd

# Dynamic DS18B20 polling: on-demand refresh
# HEAT_MODE active → refresh Evaporator (T2) every 5 s (5 times interval because of median filter)
# Allows fast defrost detection when system armed
#
# BUG-003 (S5, 2026-07-30): this used to be `interval: 1s`, firing
# component.update every second regardless of the "every 5 s" comment above —
# far faster than the ~750ms (12-bit) DS18B20 conversion time, causing
# overlapping convert/read cycles on the shared 1-Wire bus (checksum-invalid
# scratch pad reads, and occasional collision-induced NaN on T1's own read).
# Fixed by setting the interval period to actually match the stated 5 s
# cadence, instead of hammering every tick. See BUGS.md BUG-003.
- interval: 5s
  then:
  - if:
      condition:
        binary_sensor.is_on: bs_heat_mode
      then:
      - component.update: t_evap

# Any heater ON → refresh Chassis (T3) & Drain (T4) every 20 s (5 times interval because of median filter)
# Monitors heating performance and ensures temperature feedback
#
# BUG-003 (S5, 2026-07-30): same root cause as the T2 block above — was
# `interval: 4s` firing every tick instead of every 20 s. Fixed the same way.
- interval: 20s
  then:
  - if:
      condition:
        or:
        - switch.is_on: sw_heater_chassis
        - switch.is_on: sw_heater_drain
      then:
      - component.update: t_chassis
      - component.update: t_drain

# ======================== USER SETTINGS (HA-editable) ========================
# All thresholds and timers are adjustable from Home Assistant
# Values persist across reboots via restore_value: true
number:
# HEAT_MODE thresholds
# Enable when outside temp ≤ this value
- platform: template
  name: "Heat Enable Threshold (°C)"
  id: heat_on_th
  min_value: -20
  max_value: 10
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 2.0

# Disable when outside temp ≥ this value
- platform: template
  name: "Heat Disable Threshold (°C)"
  id: heat_off_th
  min_value: -10
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 4.0

# DEFROST detection thresholds
# Absolute threshold: evaporator temp must be ≥ this value
- platform: template
  name: "Defrost Evap Abs Threshold (°C)"
  id: def_abs_th
  min_value: -10
  max_value: 30
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5.0

# Delta threshold: (evaporator - outside) must be ≥ this value
- platform: template
  name: "Defrost Delta Threshold (°C)"
  id: def_dt_th
  min_value: 0
  max_value: 20
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 7.0

# Heater timing (minutes) — two-tier: floor (guaranteed min) + ceiling (safety
# max), ADR-008. Heater runs the floor unconditionally, then follows
# DEFROST_ORDERED until it drops or the ceiling is hit, whichever comes first.
# Chassis heater: guaranteed minimum run time (floor) — protects against
# short-cycling since DEFROST_ORDERED has no hysteresis.
- platform: template
  name: "Chassis Heater Min Time (min)"
  id: chassis_time_floor
  min_value: 1
  max_value: 10
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 2

# Drain heater: guaranteed minimum run time (floor)
- platform: template
  name: "Drain Heater Min Time (min)"
  id: drain_time_floor
  min_value: 1
  max_value: 10
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 3

# Chassis heater: max activation duration (ceiling — fail-safe against a stuck
# condition, ADR-007/008). Range 15-60 keeps floor < ceiling structurally true.
- platform: template
  name: "Chassis Heater Time (min)"
  id: chassis_time_ceiling
  min_value: 15
  max_value: 60
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 20

# Drain heater: max activation duration (ceiling)
- platform: template
  name: "Drain Heater Time (min)"
  id: drain_time_ceiling
  min_value: 15
  max_value: 60
  step: 1
  optimistic: true
  restore_value: true
  initial_value: 20

# SIMULATION CONTROLS (for testing without hardware)
# Manual outside temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Outside (°C)"
  id: sim_t_outside
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 10

# Manual evaporator temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Evaporator (°C)"
  id: sim_t_evap
  min_value: -5
  max_value: 25
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5

# Manual chassis temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Chassis (°C)"
  id: sim_t_chassis
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5

# Manual drain temperature (used when sim_mode is ON)
- platform: template
  name: "Sim Drain (°C)"
  id: sim_t_drain
  min_value: -5
  max_value: 15
  step: 0.5
  optimistic: true
  restore_value: true
  initial_value: 5
